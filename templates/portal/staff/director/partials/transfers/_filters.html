<form method="get" hx-get="{% url 'accounts_portal:director_transfers_subcontent' %}" hx-target="#director-transfer-subcontent" hx-swap="innerHTML" hx-indicator="#director-transfer-loading" hx-sync="#director-transfer-subcontent:replace" class="grid gap-3 border-y border-ui-border py-4 sm:grid-cols-[minmax(14rem,1fr)_minmax(12rem,16rem)_auto]">
  <input type="hidden" name="view" value="{{ transfer_subview }}">
  <label class="relative min-w-0">
    <span class="sr-only">Rechercher</span>
    <i data-lucide="search" class="pointer-events-none absolute left-3 top-3.5 h-4 w-4 text-ui-text-muted" aria-hidden="true"></i>
    <input type="search" name="transfer_q" value="{{ transfer_q }}" placeholder="Étudiant, classe ou école" class="h-ui-control w-full rounded-ui-input border border-ui-border bg-ui-surface pl-10 pr-3 text-sm text-ui-text outline-none focus:border-ui-focus focus:ring-2 focus:ring-ui-focus/20">
  </label>
  <select name="transfer_type" class="h-ui-control w-full rounded-ui-input border border-ui-border bg-ui-surface px-3 text-sm text-ui-text outline-none focus:border-ui-focus focus:ring-2 focus:ring-ui-focus/20" aria-label="Type de transfert">
    <option value="">Tous les types</option>
    {% for value, label in transfer_type_choices %}<option value="{{ value }}" {% if transfer_type_filter == value %}selected{% endif %}>{{ label }}</option>{% endfor %}
  </select>
  <button type="submit" class="ui-focus-ring inline-flex h-ui-control items-center justify-center gap-2 rounded-ui-button border border-ui-border bg-ui-surface px-4 text-sm font-semibold text-ui-text hover:bg-ui-surface-hover"><i data-lucide="filter" class="h-4 w-4"></i>Filtrer</button>
</form>
