{% load component_tags %}
<header class="flex flex-col gap-4 border-b border-ui-border pb-5 sm:flex-row sm:items-end sm:justify-between" data-ui-core="page-header">
  <div class="min-w-0">
    {% if eyebrow %}<p class="mb-1 text-xs font-bold uppercase text-ui-primary">{{ eyebrow }}</p>{% endif %}
    <h1 class="break-words text-2xl font-bold text-ui-text">{{ title|default:"Sans titre" }}</h1>
    {% if subtitle %}<p class="mt-1 max-w-3xl text-sm text-ui-text-muted">{{ subtitle }}</p>{% endif %}
  </div>
  <div class="flex shrink-0 flex-wrap gap-2">{% slot "actions" %}{% endslot %}</div>
</header>
