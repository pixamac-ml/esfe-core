<nav aria-label="{{ label }}" data-ui-core="breadcrumb">
  <ol class="flex flex-wrap items-center gap-2 text-sm text-ui-text-muted">
    {% for item in items %}
      <li class="flex items-center gap-2">
        {% if not forloop.first %}<i data-lucide="chevron-right" class="h-3.5 w-3.5" aria-hidden="true"></i>{% endif %}
        {% if item.url and not forloop.last %}<a href="{{ item.url }}" class="hover:text-ui-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ui-focus">{{ item.label }}</a>{% else %}<span {% if forloop.last %}aria-current="page" class="font-semibold text-ui-text"{% endif %}>{{ item.label }}</span>{% endif %}
      </li>
    {% endfor %}
  </ol>
</nav>
