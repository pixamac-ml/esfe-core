<div data-ui-core="progress-bar">
  <div class="mb-1 flex items-center justify-between gap-3 text-sm">
    <span class="font-semibold text-ui-text">{{ label }}</span>
    {% if show_value %}<span class="text-ui-text-muted">{{ value }} %</span>{% endif %}
  </div>
  <div
    class="w-full overflow-hidden rounded-ui-badge bg-ui-surface-muted {% if compact %}h-1.5{% else %}h-2.5{% endif %}"
    role="progressbar"
    aria-label="{{ label }}"
    aria-valuemin="0"
    aria-valuemax="100"
    aria-valuenow="{{ value }}"
  >
    <div class="h-full rounded-ui-badge {% if tone == 'success' %}bg-ui-success{% elif tone == 'warning' %}bg-ui-warning{% elif tone == 'danger' %}bg-ui-danger{% elif tone == 'info' %}bg-ui-info{% elif tone == 'neutral' %}bg-ui-text-muted{% else %}bg-ui-primary{% endif %}" style="width: {{ value }}%"></div>
  </div>
</div>
