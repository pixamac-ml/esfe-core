{% load component_tags %}
{% component "ui_core.page_header" eyebrow="Pilotage académique" title="Direction des Études" subtitle="Situation académique actuelle et actions qui nécessitent votre attention." %}
  {% fill "actions" %}
    <a
      href="{% url 'accounts_portal:director_export_report_xlsx' %}"
      class="ui-focus-ring inline-flex h-ui-control items-center gap-2 rounded-ui-button border border-ui-border bg-ui-surface px-3 text-sm font-semibold text-ui-text hover:bg-ui-surface-hover"
    >
      <i data-lucide="file-spreadsheet" class="h-4 w-4" aria-hidden="true"></i>
      <span class="hidden sm:inline">Exporter</span>
    </a>
    <button
      type="button"
      hx-get="{% url 'accounts_portal:director_workspace' %}?section=home"
      hx-target="#director-workspace"
      hx-swap="innerHTML"
      hx-sync="#director-workspace:replace"
      class="ui-focus-ring inline-flex h-ui-control items-center gap-2 rounded-ui-button bg-ui-primary px-3 text-sm font-semibold text-ui-on-primary hover:bg-ui-primary-strong"
    >
      <i data-lucide="refresh-cw" class="h-4 w-4" aria-hidden="true"></i>
      Actualiser
    </button>
  {% endfill %}
{% endcomponent %}
