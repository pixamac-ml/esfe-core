{% load component_tags %}
<div class="rounded-xl border border-[color:var(--line)] bg-[color:var(--card-soft)] px-3 py-2.5">
  <div class="flex items-center justify-between text-[11px] font-bold uppercase tracking-wide text-[color:var(--muted)]">
    <span>{{ label }}</span>
    {% if show_value %}<span>{{ pct }}%</span>{% endif %}
  </div>
  <div class="mt-2 w-full overflow-hidden rounded-full bg-[color:var(--surface-2)]
    {% if size == 'sm' %}h-1.5{% elif size == 'lg' %}h-3{% else %}h-2{% endif %}"
    role="progressbar" aria-valuenow="{{ value }}" aria-valuemin="0" aria-valuemax="{{ max_value }}" aria-label="{{ label }}">
    <div class="h-full rounded-full transition-all duration-500
      {% if tone == 'success' %}bg-[color:var(--success)]
      {% elif tone == 'warning' %}bg-[color:var(--warning)]
      {% elif tone == 'danger' %}bg-[color:var(--danger)]
      {% elif tone == 'info' %}bg-[color:var(--info)]
      {% else %}bg-[color:var(--school-primary)]{% endif %}"
      style="width:{{ pct }}%"></div>
  </div>
</div>
