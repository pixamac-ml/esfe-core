{% if page_obj and page_obj.paginator.num_pages > 1 %}
  <nav class="flex flex-wrap items-center justify-between gap-3 border-t border-ui-border px-4 py-3" aria-label="Pagination">
    <p class="text-xs font-semibold text-ui-text-muted">Page {{ page_obj.number }} / {{ page_obj.paginator.num_pages }} · {{ page_obj.paginator.count }} élément(s)</p>
    <div class="flex items-center gap-2">
      {% if page_obj.has_previous %}
        <a class="ui-focus-ring grid h-8 w-8 place-items-center rounded-ui-button border border-ui-border bg-ui-surface text-ui-text hover:bg-ui-surface-hover" href="{{ supervisor_dashboard_base_url }}?{{ supervisor_canonical_query }}&{{ page_param }}={{ page_obj.previous_page_number }}" hx-get="{% url 'accounts_portal:supervisor_workflow_workspace' %}?{{ supervisor_pagination_query }}&{{ page_param }}={{ page_obj.previous_page_number }}" hx-target="#supervisor-section-content" hx-swap="innerHTML" hx-push-url="{{ supervisor_dashboard_base_url }}?{{ supervisor_canonical_query }}&{{ page_param }}={{ page_obj.previous_page_number }}" aria-label="Page précédente"><i data-lucide="chevron-left" class="h-4 w-4"></i></a>
      {% endif %}
      {% if page_obj.has_next %}
        <a class="ui-focus-ring grid h-8 w-8 place-items-center rounded-ui-button border border-ui-border bg-ui-surface text-ui-text hover:bg-ui-surface-hover" href="{{ supervisor_dashboard_base_url }}?{{ supervisor_canonical_query }}&{{ page_param }}={{ page_obj.next_page_number }}" hx-get="{% url 'accounts_portal:supervisor_workflow_workspace' %}?{{ supervisor_pagination_query }}&{{ page_param }}={{ page_obj.next_page_number }}" hx-target="#supervisor-section-content" hx-swap="innerHTML" hx-push-url="{{ supervisor_dashboard_base_url }}?{{ supervisor_canonical_query }}&{{ page_param }}={{ page_obj.next_page_number }}" aria-label="Page suivante"><i data-lucide="chevron-right" class="h-4 w-4"></i></a>
      {% endif %}
    </div>
  </nav>
{% endif %}
