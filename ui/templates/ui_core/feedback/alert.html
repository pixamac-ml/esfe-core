{% load component_tags %}
<div x-data="{ visible: true }" x-show="visible" class="flex gap-2.5 rounded-ui-card border p-3 {% if tone == 'success' %}border-ui-success/25 bg-ui-success-soft text-ui-success{% elif tone == 'warning' %}border-ui-warning/25 bg-ui-warning-soft text-ui-warning{% elif tone == 'danger' %}border-ui-danger/25 bg-ui-danger-soft text-ui-danger{% elif tone == 'primary' %}border-ui-primary/25 bg-ui-primary-soft text-ui-primary{% elif tone == 'neutral' %}border-ui-border bg-ui-surface-muted text-ui-text{% else %}border-ui-info/25 bg-ui-info-soft text-ui-info{% endif %}" role="{% if tone == 'danger' %}alert{% else %}status{% endif %}" data-ui-core="alert">
  <i data-lucide="{% if tone == 'success' %}circle-check{% elif tone == 'warning' %}triangle-alert{% elif tone == 'danger' %}circle-alert{% else %}info{% endif %}" class="mt-0.5 h-4 w-4 shrink-0" aria-hidden="true"></i>
  <div class="min-w-0 flex-1">{% if title %}<strong class="block text-sm">{{ title }}</strong>{% endif %}<p class="break-words text-sm leading-5">{{ message }}</p>{% slot "default" %}{% endslot %}</div>
  {% if dismissible %}<button type="button" @click="visible = false" class="grid h-8 w-8 shrink-0 place-items-center rounded-ui-button hover:bg-ui-overlay/5 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ui-focus" aria-label="Fermer"><i data-lucide="x" class="h-4 w-4"></i></button>{% endif %}
</div>
