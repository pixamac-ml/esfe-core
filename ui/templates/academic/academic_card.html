{% load component_tags %}
<article class="rounded-xl border border-[color:var(--line)] bg-[color:var(--card)]
  {% if padding == 'none' %}
  {% elif padding == 'sm' %}p-3{% elif padding == 'lg' %}p-6{% else %}p-4{% endif %}
  {% if elevated %}shadow-[0_8px_24px_rgba(15,23,42,0.06)]{% endif %}
  {{ extra_class }}">
  {% if title or subtitle %}
    <header class="mb-4 flex items-start justify-between gap-3">
      <div class="min-w-0">
        {% if title %}
          <h3 class="text-sm font-black text-[color:var(--text)]">
            {% if icon %}<i data-lucide="{{ icon }}" style="width:16px;height:16px;" class="mr-1.5 inline-block text-[color:var(--school-primary)]"></i>{% endif %}{{ title }}
          </h3>
        {% endif %}
        {% if subtitle %}<p class="mt-0.5 text-xs font-semibold text-[color:var(--muted)]">{{ subtitle }}</p>{% endif %}
      </div>
      {% slot "action" %}{% endslot %}
    </header>
  {% endif %}
  {% slot "default" %}{% endslot %}
</article>
