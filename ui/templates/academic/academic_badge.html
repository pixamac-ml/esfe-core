{% load component_tags %}
{% if dot %}
  <span
    class="inline-block rounded-full w-2.5 h-2.5 {{ class_str }}
      {% if pulse %}animate-pulse{% endif %}
      {% if tone == 'success' %}bg-[color:var(--success)]
      {% elif tone == 'warning' %}bg-[color:var(--warning)]
      {% elif tone == 'danger' %}bg-[color:var(--danger)]
      {% elif tone == 'primary' %}bg-[color:var(--school-primary)]
      {% elif tone == 'info' %}bg-[color:var(--info)]
      {% else %}bg-[color:var(--muted)]{% endif %}"
    aria-label="{{ label }}"
  ></span>
{% else %}
  <span class="inline-flex items-center gap-1.5 rounded-full border px-2.5 py-1 text-[11px] font-extrabold uppercase tracking-wide transition {{ class_str }}
    {% if tone == 'success' %}border-[color:var(--success)]/30 bg-[color:var(--success-soft)] text-[color:var(--success)]
    {% elif tone == 'warning' %}border-[color:var(--warning)]/30 bg-[color:var(--warning-soft)] text-[color:var(--warning)]
    {% elif tone == 'danger' %}border-[color:var(--danger)]/30 bg-[color:var(--danger-soft)] text-[color:var(--danger)]
    {% elif tone == 'primary' %}border-[color:var(--school-primary)]/30 bg-[color:var(--school-primary-soft)] text-[color:var(--school-primary)]
    {% elif tone == 'info' %}border-[color:var(--info)]/30 bg-[color:var(--info-soft)] text-[color:var(--info)]
    {% else %}border-[color:var(--line)] bg-[color:var(--card-soft)] text-[color:var(--muted)]{% endif %}">
    {% if icon %}<i data-lucide="{{ icon }}" style="width:12px;height:12px;"></i>{% endif %}
    {{ label }}
  </span>
{% endif %}
