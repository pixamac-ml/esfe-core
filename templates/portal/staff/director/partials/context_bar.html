<section class="flex flex-wrap items-center gap-x-6 gap-y-3 border-b border-ui-border pb-4 text-sm" aria-label="Contexte académique">
  <span class="inline-flex items-center gap-2">
    <i data-lucide="building-2" class="h-4 w-4 text-ui-primary" aria-hidden="true"></i>
    <span><strong>Annexe :</strong> {{ branch.name|default:"Périmètre global" }}</span>
  </span>
  <span class="inline-flex items-center gap-2">
    <i data-lucide="calendar-range" class="h-4 w-4 text-ui-info" aria-hidden="true"></i>
    <span><strong>Année :</strong> {{ director_active_academic_year.name|default:"Non définie" }}</span>
  </span>
  <span class="inline-flex items-center gap-2">
    <i data-lucide="calendar-days" class="h-4 w-4 text-ui-success" aria-hidden="true"></i>
    <span>{{ today|date:"l d F Y" }}</span>
  </span>
  {% if director_task_count %}
    <span class="inline-flex items-center gap-2 font-semibold text-ui-warning">
      <i data-lucide="circle-alert" class="h-4 w-4" aria-hidden="true"></i>
      {{ director_task_count }} priorité{{ director_task_count|pluralize }}
    </span>
  {% endif %}
</section>
