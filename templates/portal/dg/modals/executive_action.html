<section class="space-y-5" data-overlay-title="{{ exec_action_label }}">
  <div>
    <div>
      <p class="text-xs font-black uppercase tracking-[.18em] text-amber-700">Confirmation requise</p>
      <h3 class="mt-1 text-2xl font-black text-slate-950">{{ exec_action_label }}</h3>
    </div>
  </div>

  <div class="space-y-3 rounded-2xl border border-slate-200 bg-slate-50 p-4 text-sm">
    <div><p class="text-xs font-black uppercase tracking-wide text-slate-500">Cible</p><p class="mt-1 font-black text-slate-950">{{ exec_target_label }}</p></div>
    <div class="grid grid-cols-1 gap-3 sm:grid-cols-2">
      <div><p class="text-xs font-black uppercase tracking-wide text-slate-500">Annexe</p><p class="mt-1 font-bold text-slate-800">{{ exec_branch_label }}</p></div>
      <div><p class="text-xs font-black uppercase tracking-wide text-slate-500">Année académique</p><p class="mt-1 font-bold text-slate-800">{{ exec_academic_year_label }}</p></div>
    </div>
    <div class="rounded-xl border border-amber-100 bg-amber-50 p-3 text-xs font-semibold text-amber-900"><i class="fa-solid fa-triangle-exclamation mr-1"></i>{{ exec_action_consequence }}</div>
  </div>

  <form method="post" action="{% url 'accounts_portal:dg_exec_action' %}" class="space-y-4" data-dg-interactive-form onsubmit="return dgSubmitAction(this)">
    {% csrf_token %}
    {% for key, value in exec_action_fields %}<input type="hidden" name="{{ key }}" value="{{ value }}">{% endfor %}
    <input type="hidden" name="scope_branch_id" value="{{ exec_scope_branch_id }}">
    <input type="hidden" name="academic_year_id" value="{{ exec_academic_year_id }}">
    <input type="hidden" name="confirmed" value="1">
    <label class="block">
      <span class="text-xs font-black text-slate-600">Motif{% if exec_reason_required %} <span class="text-rose-700">(obligatoire)</span>{% else %} <span class="text-slate-400">(facultatif)</span>{% endif %}</span>
      <textarea name="reason" rows="3" {% if exec_reason_required %}required{% endif %} class="mt-1 w-full rounded-xl border border-slate-200 px-3 py-2 text-sm font-semibold" placeholder="Précisez la décision ou son contexte"></textarea>
    </label>
    <div class="flex justify-end gap-3 border-t border-ui-border pt-4">
      <button type="button" class="inline-flex h-ui-control items-center rounded-ui-button border border-ui-border px-3 text-sm font-semibold text-ui-text hover:bg-ui-surface-hover" onclick="dgCloseModal()">Annuler</button>
      <button type="submit" class="inline-flex h-ui-control items-center gap-2 rounded-ui-button bg-ui-primary px-3 text-sm font-semibold text-ui-on-primary hover:bg-ui-primary-strong"><i data-lucide="check" class="h-4 w-4" aria-hidden="true"></i>Confirmer</button>
    </div>
  </form>
</section>
