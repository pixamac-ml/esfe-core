{% load component_tags %}
<div class="{% if compact %}p-4{% else %}p-5{% endif %} rounded-xl border border-dashed border-[color:var(--line)] bg-[color:var(--card-soft)] text-sm text-[color:var(--muted)]">
  <div class="flex flex-col items-center text-center">
    <span class="grid h-10 w-10 place-items-center rounded-xl
      {% if tone == 'success' %}bg-[color:var(--success-soft)] text-[color:var(--success)]
      {% elif tone == 'warning' %}bg-[color:var(--warning-soft)] text-[color:var(--warning)]
      {% elif tone == 'danger' %}bg-[color:var(--danger-soft)] text-[color:var(--danger)]
      {% elif tone == 'primary' %}bg-[color:var(--school-primary-soft)] text-[color:var(--school-primary)]
      {% elif tone == 'info' %}bg-[color:var(--info-soft)] text-[color:var(--info)]
      {% else %}bg-[color:var(--school-primary-soft)] text-[color:var(--school-primary)]{% endif %}">
      <i data-lucide="{{ icon }}" style="width:20px;height:20px;"></i>
    </span>
    {% if title %}
      <strong class="mt-3 block text-sm font-black text-[color:var(--text)]">{{ title }}</strong>
    {% endif %}
    {% if message %}
      <span class="mt-1 block max-w-xs leading-6">{{ message }}</span>
    {% endif %}
    <div class="mt-3">
      {% slot "default" %}{% endslot %}
    </div>
  </div>
</div>
