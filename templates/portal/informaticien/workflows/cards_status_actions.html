<form class="inline-flex gap-1" hx-post="{% url 'accounts_portal:it_card_status_action' %}" hx-target="#it-dashboard-workspace" hx-swap="innerHTML">
  {% csrf_token %}<input type="hidden" name="scope" value="{{ scope }}"><input type="hidden" name="card_id" value="{{ card.id }}">
  {% if card.is_valide %}<button class="btn btn-secondary" type="submit" name="action" value="lost" title="Déclarer perdue">Perdue</button><button class="btn btn-secondary" type="submit" name="action" value="revoke" title="Révoquer">Révoquer</button>{% else %}<button class="btn btn-primary" type="submit" name="action" value="reissue" title="Réémettre avec un nouveau QR">Réémettre</button>{% endif %}
</form>
