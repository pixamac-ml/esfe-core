<section aria-labelledby="temporary-password-title">
  <p class="text-xs font-black uppercase tracking-widest text-ui-primary">Réinitialisation effectuée</p>
  <h2 id="temporary-password-title" class="mt-1 text-xl font-black text-ui-text">Mot de passe temporaire</h2>
  <p class="mt-3 text-sm text-ui-text-muted">Ce mot de passe ne sera plus affiché après fermeture. Transmettez-le à l'utilisateur de manière sécurisée.</p>
  <div class="mt-4 flex items-center gap-2 rounded-xl border border-ui-border bg-ui-surface-muted p-3">
    <code id="temporary-password-value" class="min-w-0 flex-1 select-all text-lg font-black tracking-widest text-ui-text">{{ temporary_password }}</code>
    <button type="button" class="rounded-ui-button bg-ui-primary px-3 py-2 text-xs font-bold text-ui-on-primary" onclick="navigator.clipboard.writeText(document.getElementById('temporary-password-value').textContent); this.textContent='Copié'">Copier</button>
  </div>
  <button type="button" class="mt-5 w-full rounded-ui-button border border-ui-border px-4 py-2.5 text-sm font-bold text-ui-text hover:bg-ui-surface-hover" onclick="window.dispatchEvent(new CustomEvent('ui-overlay-close', {detail: {id: 'it-dashboard-modal'}})); document.getElementById('it-dashboard-modal-content').innerHTML='';">Fermer</button>
</section>
