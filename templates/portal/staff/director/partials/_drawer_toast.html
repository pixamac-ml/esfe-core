{% if toast %}
<div
  x-data="{ show: true }"
  x-show="show"
  x-init="setTimeout(() => show = false, 4000)"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0 -translate-y-2"
  x-transition:enter-end="opacity-100 translate-y-0"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100 translate-y-0"
  x-transition:leave-end="opacity-0 -translate-y-2"
  class="flex items-start gap-3 rounded-2xl border px-5 py-4 shadow-sm
    {% if toast.level == 'success' %}border-[color:var(--success-soft)] bg-[color:var(--success-soft)] text-[color:var(--success)]
    {% elif toast.level == 'error' %}border-[color:var(--danger-soft)] bg-[color:var(--danger-soft)] text-[color:var(--danger)]
    {% else %}border-[color:var(--warning-soft)] bg-[color:var(--warning-soft)] text-[color:var(--warning)]{% endif %}">
  <i data-lucide="{% if toast.level == 'success' %}check-circle{% elif toast.level == 'error' %}x-circle{% else %}alert-circle{% endif %}"
     class="w-5 h-5 shrink-0 mt-0.5"></i>
  <div class="flex-1 min-w-0">
    <p class="text-sm font-extrabold">{{ toast.message }}</p>
  </div>
  <button type="button" @click="show = false" class="shrink-0 opacity-60 hover:opacity-100 transition">
    <i data-lucide="x" class="w-4 h-4"></i>
  </button>
</div>
{% endif %}
