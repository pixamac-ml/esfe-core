{% load component_tags %}
{% load humanize %}
<span id="widget-alerts-badge"
      hx-get="{% url 'accounts:widget_alerts_badge' %}"
      hx-trigger="every 45s, dashboardStatsUpdated from:body"
      hx-swap="outerHTML"
      style="display:inline-flex; align-items:center; gap:6px;">
  {% if alerts_count > 0 %}
  <span class="dashboard-btn dashboard-btn-danger" style="font-size:.65rem; height:26px; padding:0 .5rem; pointer-events:none;">
    {% component "icon" name="bell" %}{% endcomponent %} {{ alerts_count }}
  </span>
  {% endif %}
  {% if priorities_count > 0 %}
  <span class="dashboard-btn dashboard-btn-warning" style="font-size:.65rem; height:26px; padding:0 .5rem; pointer-events:none;">
    {% component "icon" name="list-check" %}{% endcomponent %} {{ priorities_count }}
  </span>
  {% endif %}
</span>
