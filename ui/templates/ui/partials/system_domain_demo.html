{% load component_tags %}
<div class="space-y-3">
  <div class="flex items-center justify-between gap-3 border-b border-ui-border pb-3">
    <div>
      <p class="text-xs font-semibold uppercase tracking-wide text-ui-primary">Démonstration</p>
      <h4 class="text-sm font-bold text-ui-text">{{ component.label }}</h4>
    </div>
    <span class="rounded-full bg-ui-surface-muted px-2.5 py-1 text-[10px] font-semibold text-ui-text-muted">{{ component.name }}</span>
  </div>

  <div class="rounded-ui-card border border-ui-border bg-ui-surface p-4">
    {{ demo_html|safe }}
  </div>
</div>
