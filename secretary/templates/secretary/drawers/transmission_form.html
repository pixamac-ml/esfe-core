{% load component_tags %}
<div class="space-y-4">
  <div><p class="text-xs font-bold uppercase text-ui-text-muted">Action rapide</p><h2 class="mt-1 text-lg font-bold text-ui-text">Nouvelle transmission</h2><p class="mt-1 text-xs text-ui-text-muted">Le service destinataire verra la demande dans son espace.</p></div>
  <form method="post" hx-post="{% url 'secretary:transmission_create' %}" hx-target="#sg-drawer-content" hx-swap="innerHTML" class="space-y-3">{% csrf_token %}
    {% for field in form %}<label class="block text-sm font-semibold text-ui-text"><span>{{ field.label }}</span>{{ field }}{% if field.errors %}<span class="mt-1 block text-xs text-ui-danger">{{ field.errors|join:' ' }}</span>{% endif %}</label>{% endfor %}
    <div class="flex justify-end gap-2 pt-2"><button type="button" onclick="window.sgCloseDrawer && window.sgCloseDrawer()" class="rounded-ui-button border border-ui-border px-3 py-2 text-sm font-semibold">Annuler</button><button class="rounded-ui-button bg-ui-primary px-3 py-2 text-sm font-semibold text-ui-on-primary">Transmettre</button></div>
  </form>
</div>
