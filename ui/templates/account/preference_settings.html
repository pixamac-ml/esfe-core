{% load component_tags %}
<div data-ui-core="preference-settings" class="space-y-6">
  <h3 class="text-lg font-bold text-ui-text">Préférences</h3>

  <form {% if hx_post %}hx-post="{{ hx_post }}" hx-target="{{ hx_target|default:'#preferences-container' }}" hx-swap="innerHTML" hx-indicator="#prefs-loading"{% endif %} method="POST" class="space-y-4">
    {% csrf_token %}
    {% if form %}
      {% for field in form %}
        <div class="space-y-1.5">
          <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-ui-text">
            {{ field.label }}
          </label>
          {{ field }}
          {% if field.help_text %}
            <p class="text-xs text-ui-text-muted">{{ field.help_text }}</p>
          {% endif %}
          {% if field.errors %}
            <p class="text-xs text-ui-danger" role="alert">{{ field.errors.0 }}</p>
          {% endif %}
        </div>
      {% endfor %}
    {% endif %}

    <div id="prefs-loading" class="htmx-indicator">
      <div class="flex items-center gap-2 text-sm text-ui-text-muted">
        <div class="h-4 w-4 animate-spin rounded-full border-2 border-ui-border border-t-ui-info"></div>
        Enregistrement...
      </div>
    </div>

    <div class="flex justify-end border-t border-ui-border pt-4">
      <button type="submit" class="rounded-ui-button bg-ui-info px-4 py-2 text-sm font-semibold text-white hover:bg-ui-info/90 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ui-focus focus-visible:ring-offset-2">
        Enregistrer les préférences
      </button>
    </div>
  </form>
</div>
