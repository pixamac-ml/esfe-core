{% load humanize %}
{% if valid %}
<div class="rounded-2xl border border-emerald-200 bg-emerald-50 px-4 py-3 text-sm" data-coupon-valid="1">
    <p class="font-semibold text-emerald-800">{{ coupon.label }}</p>
    <p class="mt-1 text-emerald-700">
        Reduction : {% if coupon.discount_type == "percentage" %}{{ coupon.value }}%{% else %}{{ coupon.value|intcomma }} FCFA{% endif %}
        — Nouveau montant : <span class="font-bold">{{ new_amount|intcomma }} FCFA</span>
    </p>
</div>
{% else %}
<div class="rounded-2xl border border-rose-200 bg-rose-50 px-4 py-3 text-sm text-rose-700" data-coupon-valid="0">
    {{ message }}
</div>
{% endif %}
