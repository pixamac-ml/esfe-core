<header class="flex flex-col gap-2 border-b border-slate-200 bg-white px-3 py-2.5 sm:flex-row sm:items-center sm:justify-between">
  <div class="min-w-0">
    <h2 class="sr-only">Gestion des notes</h2>
    <p class="truncate text-sm font-semibold text-slate-900">{{ academic_class.display_name|default:academic_class }}</p>
    <p class="text-xs text-slate-500">{{ rows|length }} étudiant{{ rows|length|pluralize }} · saisie par EC</p>
  </div>
  <div class="flex flex-wrap items-center gap-1.5 text-xs font-medium">
    <span class="rounded-md bg-slate-100 px-2 py-1 text-slate-700">{{ academic_class.academic_year }}</span>
    <span class="rounded-md bg-slate-100 px-2 py-1 text-slate-700">Semestre {{ semester.number }}</span>
    <span class="rounded-md bg-indigo-50 px-2 py-1 text-indigo-700">{{ active_session_label }}</span>
    <span class="rounded-md border border-slate-200 bg-white px-2 py-1 text-slate-700">{{ workflow_badge.icon|safe }} {{ workflow_badge.label }}</span>
  </div>
</header>
