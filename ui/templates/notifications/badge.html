{% if count > 0 %}
<span
  class="js-notification-unread-count inline-flex items-center justify-center rounded-full bg-ui-danger text-white font-bold {% if size == 'lg' %}h-6 min-w-6 px-1.5 text-xs{% elif size == 'md' %}h-5 min-w-5 px-1 text-[10px]{% else %}h-4 min-w-4 px-1 text-[9px]{% endif %}"
  aria-label="{{ count }} non lues"
  data-ui-core="notification-badge"
>
  {% if count > max_count %}{{ max_count }}+{% else %}{{ count }}{% endif %}
</span>
{% endif %}
