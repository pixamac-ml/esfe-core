{% load component_tags %}
<div class="space-y-4" data-director-transcript-preview>
  <div class="flex items-center justify-between gap-3"><div><p class="text-xs font-black uppercase tracking-wide text-ui-primary">Aperçu du relevé individuel</p><h3 class="mt-1 text-lg font-black text-ui-text">{{ bulletin.reference }}</h3></div><a href="{% url 'academics:bulletin_pdf' bulletin.id %}" target="_blank" class="ui-focus-ring inline-flex h-10 items-center gap-2 rounded-ui-button bg-ui-primary px-4 text-sm font-bold text-white"><i data-lucide="download" class="h-4 w-4"></i>PDF</a></div>
  <div class="h-[72vh] min-h-[540px] overflow-hidden rounded-ui-card border border-ui-border bg-ui-surface-muted"><iframe title="Aperçu {{ bulletin.reference }}" src="{% url 'academics:bulletin_detail' bulletin.id %}" class="h-full w-full border-0 bg-white"></iframe></div>
</div>
