<aside class="rail" :class="mobileNav ? 'mobile-open' : ''" @click="if ($event.target.closest('a')) mobileNav = false">
  <div class="rail-brand">
    <div class="eyebrow">Surveillant général</div>
    <div class="name">ESFÉ Core</div>
    <div class="sub">{{ branch.name|default:"Annexe" }}</div>
  </div>
  {% include "portal/staff/supervisor/partials/_sidebar_nav_inner.html" %}
  <div class="rail-foot">
    <div class="who">
      <div class="avatar">{{ user_initials|default:"SG" }}</div>
      <div class="meta"><b>{{ user_display_name|default:request.user.get_full_name }}</b><span>Surveillant général</span></div>
    </div>
    <form method="post" action="{% url 'accounts:logout' %}">
      {% csrf_token %}
      <button type="submit" class="logout"><i data-lucide="log-out" class="i" aria-hidden="true"></i> Déconnexion</button>
    </form>
  </div>
</aside>
