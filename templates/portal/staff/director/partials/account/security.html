{% load component_tags %}
<div class="space-y-4" data-director-account-view="security">
  {% component "account.security_settings"
    password_form=password_form
    hx_post="{% url 'accounts_portal:director_account_panel' %}?view=security"
    hx_target="#director-drawer-content"
  %}{% endcomponent %}
  <div class="rounded-ui-card border border-ui-border bg-ui-surface-muted/40 p-4 text-sm text-ui-text-muted">
    <p>Email de connexion</p>
    <p class="mt-1 font-medium text-ui-text">{{ email|default:"Non renseigne" }}</p>
  </div>
</div>
