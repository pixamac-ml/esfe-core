{% load static component_tags %}
<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{% block title %}UI Core | ESFE{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'public/css/main.css' %}">
  <script defer src="{% static 'vendor/lucide/lucide.min.js' %}"></script>
  <script defer src="{% static 'vendor/chartjs/chart.umd.min.js' %}"></script>
  <script defer src="{% static 'src/js/ui_core/index.js' %}"></script>
  <script defer src="{% static 'vendor/alpinejs/alpine.min.js' %}"></script>
  <script defer src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
</head>
<body class="ui-system-body">
  {% block content %}{% endblock %}
  <div id="ui-toast-region" class="pointer-events-none fixed bottom-4 left-4 right-4 z-ui-skip flex flex-col gap-2 sm:left-auto sm:w-full sm:max-w-sm" aria-live="polite" aria-label="Notifications"></div>
</body>
</html>
