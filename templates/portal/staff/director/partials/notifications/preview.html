{% load component_tags %}
<div class="space-y-2 p-2">
  <div class="flex items-center justify-between px-2 pt-1">
    <p class="text-xs font-semibold uppercase tracking-wide text-ui-text-muted">Aperçu des notifications</p>
    {% if unread_count %}
      <span class="rounded-full bg-ui-danger/10 px-2 py-0.5 text-[10px] font-bold text-ui-danger">{{ unread_count }} non lues</span>
    {% endif %}
  </div>
  {% component "notifications.list"
    notifications=notifications
    detail_target="#director-drawer-content"
    detail_opens_drawer=True
  %}{% endcomponent %}
</div>
