<span class="inline-flex max-w-full items-center gap-1.5 rounded-ui-badge px-2 py-1 text-xs font-semibold {% if tone == 'success' %}bg-ui-success-soft text-ui-success{% elif tone == 'warning' %}bg-ui-warning-soft text-ui-warning{% elif tone == 'danger' %}bg-ui-danger-soft text-ui-danger{% elif tone == 'info' %}bg-ui-info-soft text-ui-info{% elif tone == 'primary' %}bg-ui-primary-soft text-ui-primary{% else %}bg-ui-surface-muted text-ui-text-muted{% endif %}" data-ui-core="status-badge">
  {% if dot %}<span class="h-1.5 w-1.5 shrink-0 rounded-ui-badge bg-current" aria-hidden="true"></span>{% endif %}
  {% if icon %}<i data-lucide="{{ icon }}" class="h-3.5 w-3.5 shrink-0" aria-hidden="true"></i>{% endif %}
  <span class="truncate">{{ label }}</span>
</span>
