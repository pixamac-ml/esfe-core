{% load component_tags %}
<a
  href="{% url 'accounts_portal:system_profile' %}"
  class="inline-flex h-9 items-center gap-2 rounded-ui-button border border-ui-border bg-ui-surface px-3 text-sm font-semibold text-ui-text hover:bg-ui-surface-hover"
>
  <i data-lucide="user-round" class="h-4 w-4" aria-hidden="true"></i>
  <span class="hidden sm:inline">Mon compte</span>
</a>
<button
  type="button"
  class="grid h-9 w-9 place-items-center rounded-ui-button border border-ui-border bg-ui-surface text-ui-text hover:bg-ui-surface-hover"
  onclick="window.location.reload()"
  title="Actualiser"
  aria-label="Actualiser le dashboard"
>
  <i data-lucide="refresh-cw" class="h-4 w-4" aria-hidden="true"></i>
</button>
<form method="post" action="{% url 'accounts:logout' %}">
  {% csrf_token %}
  <button
    type="submit"
    class="grid h-9 w-9 place-items-center rounded-ui-button border border-ui-danger/20 bg-ui-danger/5 text-ui-danger hover:bg-ui-danger/10"
    title="Deconnexion"
    aria-label="Se deconnecter"
  >
    <i data-lucide="log-out" class="h-4 w-4" aria-hidden="true"></i>
  </button>
</form>
