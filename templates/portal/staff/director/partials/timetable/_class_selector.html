<form hx-get="{% url 'accounts_portal:director_timetable_subcontent' %}"
      hx-trigger="change"
      hx-target="#director-timetable-subcontent"
      hx-swap="innerHTML"
      hx-indicator="#director-timetable-loading"
      hx-sync="#director-timetable-subcontent:replace"
      class="min-w-0">
  <input type="hidden" name="view" value="{{ timetable_subview }}">
  {% if timetable_week_start %}<input type="hidden" name="week_start" value="{{ timetable_week_start|date:'Y-m-d' }}">{% endif %}
  <label for="director-timetable-class" class="mb-1.5 block text-xs font-semibold text-ui-text-muted">Classe</label>
  <div class="relative">
    <i data-lucide="school" class="pointer-events-none absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-ui-text-muted" aria-hidden="true"></i>
    <select id="director-timetable-class"
            name="class_id"
            class="ui-focus-ring h-ui-control w-full appearance-none rounded-ui-input border border-ui-border bg-ui-surface pl-10 pr-10 text-sm font-semibold text-ui-text">
      <option value="">Sélectionner une classe</option>
      {% for academic_class in timetable_classes %}
        <option value="{{ academic_class.id }}" {% if timetable_selected_class.id == academic_class.id %}selected{% endif %}>{{ academic_class.display_name }} · {{ academic_class.academic_year.name }}</option>
      {% endfor %}
    </select>
    <i data-lucide="chevron-down" class="pointer-events-none absolute right-3 top-1/2 h-4 w-4 -translate-y-1/2 text-ui-text-muted" aria-hidden="true"></i>
  </div>
</form>
