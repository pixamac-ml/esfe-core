<div
  id="ui-toast-region"
  class="pointer-events-none fixed bottom-4 left-4 right-4 z-ui-skip flex flex-col gap-2 sm:left-auto sm:w-full sm:max-w-sm"
  aria-live="polite"
  aria-label="Notifications"
></div>
{% if messages %}
<script id="ui-toast-bootstrap" type="application/json">
[
{% for message in messages %}
  {
    "message": "{{ message|escapejs }}",
    "tone": "{% if message.tags == 'error' %}danger{% elif message.tags == 'warning' %}warning{% elif message.tags == 'success' %}success{% else %}info{% endif %}"
  }{% if not forloop.last %},{% endif %}
{% endfor %}
]
</script>
{% endif %}
