{% if loading %}
{% if variant == "blocking" %}
<div class="absolute inset-0 z-20 grid place-items-center bg-ui-surface/80 backdrop-blur-ui-overlay" role="status" aria-live="polite" data-ui-core="loading-overlay" data-variant="blocking">
  <div class="flex items-center gap-3 rounded-ui-card bg-ui-surface px-4 py-3 shadow-ui-dropdown">
    <span class="h-5 w-5 animate-spin rounded-ui-badge border-2 border-ui-border border-t-ui-primary" aria-hidden="true"></span>
    <span class="text-sm font-semibold text-ui-text">{{ label }}</span>
  </div>
</div>
{% else %}
<div class="pointer-events-none absolute inset-x-0 top-3 z-20 flex justify-center" role="status" aria-live="polite" data-ui-core="loading-overlay" data-variant="subtle">
  <span class="inline-flex items-center gap-2 rounded-ui-button border border-ui-border bg-ui-surface px-3 py-1.5 text-xs font-semibold text-ui-text shadow-ui-dropdown">
    <span class="h-3.5 w-3.5 animate-spin rounded-full border-2 border-ui-border border-t-ui-primary" aria-hidden="true"></span>
    {{ label }}
  </span>
</div>
{% endif %}
{% endif %}
