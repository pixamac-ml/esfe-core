<div class="group h-full rounded-2xl border border-[color:var(--line)] bg-[linear-gradient(145deg,var(--card),var(--card-soft))] px-5 py-5 shadow-[0_16px_36px_-30px_rgba(15,23,42,.65)] transition duration-200 hover:-translate-y-0.5 hover:border-blue-200 hover:shadow-[0_20px_42px_-28px_rgba(37,99,235,.45)]">
  {% if icon %}
    <div class="mb-4 grid h-10 w-10 place-items-center rounded-xl bg-[color:var(--school-primary-soft)] text-[color:var(--school-primary)] transition group-hover:scale-105">
      <i data-lucide="{{ icon }}" style="width:18px;height:18px;"></i>
    </div>
  {% endif %}
  <span class="block text-[10px] font-black uppercase tracking-[.14em] text-[color:var(--muted)]">{{ label }}</span>
  <strong class="mt-1 block truncate text-2xl font-black tracking-tight text-[color:var(--text)]">{{ value }}</strong>
  {% if hint %}<span class="mt-2 block text-xs font-semibold text-[color:var(--muted)]">{{ hint }}</span>{% endif %}
</div>
