{% extends "base.html" %}
{% block content %}
<main class="mx-auto max-w-md px-4 py-16">
  <section class="rounded-2xl border border-emerald-100 bg-emerald-50 p-6 text-center">
    <h1 class="text-2xl font-black text-slate-950">Accès activé</h1>
    <p class="mt-3 text-sm font-semibold text-emerald-900">Votre mot de passe a été défini. Vous pouvez vous connecter avec l'identifiant {{ username }}.</p>
    <a href="{% url 'login' %}" class="mt-5 inline-flex rounded-xl bg-slate-950 px-4 py-3 text-sm font-black text-white">Se connecter</a>
  </section>
</main>
{% endblock %}
