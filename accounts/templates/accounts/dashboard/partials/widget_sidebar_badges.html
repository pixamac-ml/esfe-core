{% load humanize %}
<div id="widget-sidebar-badges"
     hx-get="{% url 'accounts:widget_sidebar_badges' %}"
     hx-trigger="every 30s, candidatureUpdated from:body, paymentUpdated from:body"
     hx-swap="outerHTML"
     style="display:contents;">
  {% if candidatures_pending %}
  <span class="inline-flex min-w-5 items-center justify-center rounded-ui-badge bg-ui-danger px-1.5 py-0.5 text-xs font-bold text-white" data-badge="candidatures">{{ candidatures_pending }}</span>
  {% endif %}
  {% if pending_payments %}
  <span class="inline-flex min-w-5 items-center justify-center rounded-ui-badge bg-ui-warning px-1.5 py-0.5 text-xs font-bold text-white" data-badge="payments">{{ pending_payments }}</span>
  {% endif %}
</div>
