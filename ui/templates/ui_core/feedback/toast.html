<div x-data="{ visible: {{ visible|yesno:'true,false' }} }" x-show="visible" class="flex max-w-sm items-center gap-3 rounded-ui-card border border-ui-border bg-ui-surface p-4 shadow-ui-dropdown" role="status" data-ui-core="toast">
  <span class="h-2.5 w-2.5 rounded-ui-badge {% if tone == 'success' %}bg-ui-success{% elif tone == 'warning' %}bg-ui-warning{% elif tone == 'danger' %}bg-ui-danger{% else %}bg-ui-info{% endif %}" aria-hidden="true"></span>
  <p class="min-w-0 flex-1 break-words text-sm text-ui-text">{{ message|default:"Notification" }}</p>
  <button type="button" @click="visible = false" class="grid h-8 w-8 place-items-center rounded-ui-button hover:bg-ui-surface-muted" aria-label="Fermer"><i data-lucide="x" class="h-4 w-4"></i></button>
</div>
