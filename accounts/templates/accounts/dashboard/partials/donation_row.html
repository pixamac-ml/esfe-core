{% load humanize %}
<tr id="donation-row-{{ donation.id }}">
  <td style="font-weight:800;">{{ donation.donor_name }}</td>
  <td>{{ donation.amount|intcomma }} FCFA</td>
  <td>{{ donation.get_motif_display }}</td>
  <td>{{ donation.get_payment_method_display }}</td>
  <td>{{ donation.date|date:"d/m/Y" }}</td>
  <td>
    <a class="dashboard-btn dashboard-btn-outline" style="font-size:.65rem; height:28px; padding:0 .5rem; text-decoration:none;" href="{% url 'accounts:manager_donation_receipt_pdf' donation.id %}" hx-boost="false" title="Reçu de don">Reçu</a>
  </td>
</tr>
