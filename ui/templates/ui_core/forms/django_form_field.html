<div class="space-y-1.5 {% if is_wide %}md:col-span-2{% endif %}" data-ui-core="form-field">
  {% if is_checkbox %}
    <label for="{{ field.id_for_label }}" class="flex min-h-ui-control items-center gap-3 rounded-ui-input border border-ui-border bg-ui-surface px-3 text-sm font-semibold text-ui-text hover:bg-ui-surface-hover">
      {{ field }}
      <span>{{ field.label }}{% if field.field.required %}<span class="text-ui-danger" aria-hidden="true"> *</span>{% endif %}</span>
    </label>
  {% else %}
    <label for="{{ field.id_for_label }}" class="block text-sm font-semibold text-ui-text">{{ field.label }}{% if field.field.required %}<span class="text-ui-danger" aria-hidden="true"> *</span>{% endif %}</label>
    <div class="[&_input]:h-ui-control [&_input]:w-full [&_input]:rounded-ui-input [&_input]:border [&_input]:border-ui-border [&_input]:bg-ui-surface [&_input]:px-3 [&_input]:text-sm [&_input]:text-ui-text [&_input]:focus:border-ui-focus [&_input]:focus:ring-ui-focus [&_select]:h-ui-control [&_select]:w-full [&_select]:rounded-ui-input [&_select]:border [&_select]:border-ui-border [&_select]:bg-ui-surface [&_select]:px-3 [&_select]:text-sm [&_select]:text-ui-text [&_select]:focus:border-ui-focus [&_select]:focus:ring-ui-focus [&_textarea]:min-h-24 [&_textarea]:w-full [&_textarea]:rounded-ui-input [&_textarea]:border [&_textarea]:border-ui-border [&_textarea]:bg-ui-surface [&_textarea]:px-3 [&_textarea]:py-2 [&_textarea]:text-sm [&_textarea]:text-ui-text [&_textarea]:focus:border-ui-focus [&_textarea]:focus:ring-ui-focus">
      {{ field }}
    </div>
  {% endif %}
  {% if field.help_text %}<p class="text-xs text-ui-text-muted">{{ field.help_text }}</p>{% endif %}
  {% if field.errors %}<ul class="space-y-1 text-xs font-semibold text-ui-danger">{% for error in field.errors %}<li>{{ error }}</li>{% endfor %}</ul>{% endif %}
</div>
