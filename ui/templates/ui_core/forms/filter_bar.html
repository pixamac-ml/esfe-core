<form
  action="{{ action }}"
  method="{{ method }}"
  class="min-w-0 rounded-ui-card border border-ui-border bg-ui-surface p-4"
  data-ui-core="filter-bar"
  {% if target %}{% if method == "post" %}hx-post="{{ action }}"{% else %}hx-get="{{ action }}"{% endif %} hx-target="{{ target }}" hx-swap="{{ swap }}"{% endif %}
  {% if select %}hx-select="{{ select }}"{% endif %}
  {% if trigger %}hx-trigger="{{ trigger }}"{% endif %}
  {% if indicator %}hx-indicator="{{ indicator }}"{% endif %}
  {% if sync %}hx-sync="{{ sync }}"{% endif %}
>
  {% if method == "post" %}{% csrf_token %}{% endif %}
  {% for field in hidden_fields %}<input type="hidden" name="{{ field.name }}" value="{{ field.value }}">{% endfor %}
  <div class="flex flex-col gap-3 sm:flex-row sm:flex-wrap sm:items-end">
    {% for filter in filters %}
      <label class="min-w-0 flex-1 text-sm font-semibold text-ui-text sm:min-w-40">
        <span class="mb-1.5 block">{{ filter.label }}</span>
        {% if filter.options %}
          <select name="{{ filter.name }}" class="w-full rounded-ui-input border-ui-border bg-ui-surface text-sm focus:border-ui-focus focus:ring-ui-focus {% if density == 'compact' %}h-9{% else %}h-ui-control{% endif %}">
            {% for option in filter.options %}<option value="{{ option.value }}" {% if option.selected %}selected{% endif %}>{{ option.label }}</option>{% endfor %}
          </select>
        {% else %}
          <span class="relative block">
            <input type="{{ filter.type|default:'text' }}" name="{{ filter.name }}" value="{{ filter.value|default:'' }}" placeholder="{{ filter.placeholder }}" class="w-full rounded-ui-input border-ui-border pr-9 text-sm focus:border-ui-focus focus:ring-ui-focus {% if density == 'compact' %}h-9{% else %}h-ui-control{% endif %}"{% if filter.name == live_search_name and target %} hx-get="{{ action }}" hx-trigger="input changed delay:{{ live_search_delay }}ms, search" hx-target="{{ target }}" hx-swap="{{ swap }}" hx-include="closest form" hx-sync="closest form:replace"{% endif %}>
            {% if filter.clearable %}<button type="button" data-ui-clear-input class="absolute right-1 top-1/2 grid h-8 w-8 -translate-y-1/2 place-items-center rounded-ui-button text-ui-text-muted hover:bg-ui-surface-hover" aria-label="Effacer {{ filter.label }}"><i data-lucide="x" class="h-4 w-4"></i></button>{% endif %}
          </span>
        {% endif %}
      </label>
    {% endfor %}
    <div class="flex max-w-full flex-wrap gap-2">
      {% if reset_url %}<button type="button" hx-get="{{ reset_url }}" {% if target %}hx-target="{{ target }}" hx-swap="{{ swap }}"{% endif %} class="inline-flex h-ui-control items-center rounded-ui-button border border-ui-border px-4 text-sm font-semibold hover:bg-ui-surface-hover">Tout effacer</button>{% endif %}
      <button type="submit" class="inline-flex h-ui-control items-center rounded-ui-button bg-ui-primary px-4 text-sm font-semibold text-ui-on-primary hover:bg-ui-primary-strong focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ui-focus">{{ submit_label }}</button>
    </div>
  </div>
  {% if active_filters %}
    <div class="mt-3 flex flex-wrap items-center gap-2" aria-label="Filtres actifs">
      {% for filter in active_filters %}<span class="rounded-ui-badge bg-ui-primary-soft px-2.5 py-1 text-xs font-semibold text-ui-primary">{{ filter }}</span>{% endfor %}
    </div>
  {% endif %}
</form>
