<a
  x-data="{ shown: false }"
  x-intersect:enter.once="shown = true"
  :class="shown
          ? 'opacity-100 translate-y-0 scale-100'
          : 'opacity-0 translate-y-5 scale-[0.985]'"
  href="{{ url }}"
  class="group relative block min-h-[320px] h-full overflow-hidden rounded-3xl p-3 text-white shadow-soft
         transform transition-[transform,opacity,box-shadow] duration-300 ease-premium hover:-translate-y-1 hover:shadow-2xl
         {% if cycle_theme == 'secondary' %}bg-secondary{% elif cycle_theme == 'dark' %}bg-gray-900{% else %}bg-primary{% endif %}"
>
    <div class="pointer-events-none absolute -right-10 -top-10 h-36 w-36 rounded-full bg-white/15"></div>

    <div class="relative flex h-full flex-col gap-2.5 rounded-[1.15rem] bg-white/5 p-4 backdrop-blur-[2px] sm:p-5">
        <div class="flex justify-between items-center gap-2">
            <span class="text-[11px] uppercase tracking-[0.16em] font-semibold text-white/75 line-clamp-1">
                {{ cycle }}
            </span>

            {% if is_featured %}
            <span class="rounded-full bg-white/15 px-2.5 py-1 text-[11px] font-semibold text-white whitespace-nowrap">
                À la une
            </span>
            {% endif %}
        </div>

        <h3 class="text-lg sm:text-xl font-bold leading-snug text-white line-clamp-2 text-balance">
            {{ title }}
        </h3>

        <p class="text-sm leading-5 text-white/85 line-clamp-2">
            {{ short_description }}
        </p>

        <div class="mt-auto grid grid-cols-2 gap-2 border-t border-white/25 pt-3 text-sm">
            <span class="rounded-lg bg-white/10 px-2.5 py-1.5 text-white/85"><span class="block text-[10px] text-white/60">Durée</span><strong class="text-white">{{ duration }} an{{ duration|pluralize }}</strong></span>
            <span class="rounded-lg bg-white/10 px-2.5 py-1.5 text-right text-white/85"><span class="block text-[10px] text-white/60">Diplôme</span><strong class="block text-white line-clamp-1">{{ diploma }}</strong></span>
        </div>

        <div>
            <span class="inline-flex items-center gap-2 text-xs font-semibold text-white transition-transform duration-200 ease-premium group-hover:translate-x-1">
                Voir le programme
                <span aria-hidden="true">-></span>
            </span>
        </div>
    </div>
</a>
