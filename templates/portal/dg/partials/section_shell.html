{% load component_tags %}
<section
  class="space-y-5"
  data-dashboard-section="{{ dg_active_section }}"
  data-executive-section="{{ dg_active_section }}"
  data-dg-domain="{{ dg_active_domain }}"
>
  {% if dg_secondary_navigation|length > 1 %}
    {% component "ui_core.tabs" id="dg-domain-subnav" items=dg_secondary_navigation active=dg_active_section density="compact" subview_attr="dg-section" %}{% endcomponent %}
  {% endif %}

  <div class="min-w-0" aria-live="polite">
    {% include dg_section_template %}
  </div>
</section>
