{% load component_tags humanize %}
<div id="session-row-{{ session.id }}">
  {% component "ui_core.alert" title="Paiement espèces enregistré" message=payment.inscription.candidature.full_name tone="success" %}
    <span class="mt-2 block text-sm font-bold tabular-nums text-ui-success">{{ payment.amount|intcomma }} FCFA</span>
    <span class="mt-1 block text-xs text-ui-text-muted">Reçu : {{ payment.receipt_number|default:payment.reference }}</span>
  {% endcomponent %}
</div>
