<div class="flex flex-col items-center justify-center px-5 {% if compact %}py-5{% else %}py-7{% endif %} text-center" data-ui-core="empty-state">
  <span class="grid {% if compact %}h-9 w-9{% else %}h-10 w-10{% endif %} place-items-center rounded-ui-button bg-ui-surface-muted text-ui-text-muted"><i data-lucide="{{ icon }}" class="h-4 w-4" aria-hidden="true"></i></span>
  <h3 class="mt-2 text-sm font-bold text-ui-text">{{ title }}</h3>
  {% if message %}<p class="mt-1 max-w-md text-sm text-ui-text-muted">{{ message }}</p>{% endif %}
  {% if action_label and action_url %}<a href="{{ action_url }}" class="mt-4 rounded-ui-button bg-ui-primary px-4 py-2 text-sm font-semibold text-ui-on-primary focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ui-focus">{{ action_label }}</a>{% endif %}
</div>
