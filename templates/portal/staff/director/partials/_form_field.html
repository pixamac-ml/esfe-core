<label for="{{ field.id_for_label }}" class="mb-1.5 block text-sm font-semibold text-ui-text">
  {{ field.label }}{% if field.field.required %}<span class="text-ui-danger" aria-hidden="true"> *</span>{% endif %}
</label>
{{ field }}
{% if field.help_text %}<p class="mt-1.5 text-xs text-ui-text-muted">{{ field.help_text }}</p>{% endif %}
{% for error in field.errors %}<p class="mt-1.5 text-xs font-medium text-ui-danger">{{ error }}</p>{% endfor %}
