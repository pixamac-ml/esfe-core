{% load component_tags %}
<div class="divide-y divide-ui-border overflow-hidden rounded-ui-card border border-ui-border">{% for case in cases %}<button type="button" class="ui-focus-ring flex w-full items-center gap-3 px-4 py-3 text-left hover:bg-ui-surface-hover" hx-get="{% url 'accounts_portal:supervisor_case_detail' 'student' case.id %}" hx-target="#supervisor-drawer-content"><span class="min-w-0 flex-1"><strong class="block truncate text-sm text-ui-text">{{ case.title }}</strong><span class="text-xs text-ui-text-muted">{{ case.created_at|date:"d/m/Y" }} · {{ case.get_case_type_display }}</span></span>{% component "ui_core.status_badge" label="Transmis" tone="success" %}{% endcomponent %}</button>{% empty %}<div class="p-4">{% component "ui_core.empty_state" icon="folder-x" title="Aucun signalement" message="Aucun signalement n'est lié à cet étudiant." compact=True %}{% endcomponent %}</div>{% endfor %}</div>
