{% load component_tags %}
<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between {{ class_str }}">
  <div class="min-w-0">
    {% if title %}<h2 class="text-base font-black text-[color:var(--text)]">{{ title }}</h2>{% endif %}
    {% if total_count > 0 %}
      <span class="text-xs font-bold text-[color:var(--muted-2)]">
        {{ total_count }} {{ count_label }}{% if total_count > 1 %}s{% endif %}
      </span>
    {% endif %}
    {% slot "left" %}{% endslot %}
  </div>
  <div class="flex flex-wrap items-center gap-2">
    {% slot "actions" %}{% endslot %}
  </div>
</div>
