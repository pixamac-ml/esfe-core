{% extends "base.html" %}

{% block public_navbar %}{% endblock %}
{% block public_footer %}{% endblock %}
{% block public_floating_widget %}{% endblock %}

{% block content %}
<div class="min-h-screen bg-slate-100">
  <header class="bg-slate-950 text-white border-b border-slate-800">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 py-4 flex items-center justify-between gap-4">
      <a href="{{ dashboard_url }}" class="font-bold tracking-tight">ESFE <span class="text-sky-300">Portal</span></a>
      <nav class="flex items-center gap-2 text-sm">
        <a href="{{ dashboard_url }}" class="px-3 py-2 rounded-lg hover:bg-slate-800">Dashboard</a>
        <a href="{% url 'notification_center:notifications' %}" class="px-3 py-2 rounded-lg hover:bg-slate-800">Notifications</a>
        <a href="{% url 'accounts_portal:system_profile_edit' %}" class="px-3 py-2 rounded-lg hover:bg-slate-800">Mon compte</a>
        <a href="{% url 'accounts_portal:system_security' %}" class="px-3 py-2 rounded-lg hover:bg-slate-800">Securite</a>
        <div data-portal-notification-slot></div>
      </nav>
    </div>
  </header>
  <main class="max-w-7xl mx-auto px-4 sm:px-6 py-8">{% block system_workspace %}{% endblock %}</main>
</div>
{% endblock %}
