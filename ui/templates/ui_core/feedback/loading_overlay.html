{% if loading %}
<div class="absolute inset-0 z-20 grid place-items-center bg-ui-surface/80 backdrop-blur-ui-overlay" role="status" aria-live="polite" data-ui-core="loading-overlay">
  <div class="flex items-center gap-3 rounded-ui-card bg-ui-surface px-4 py-3 shadow-ui-dropdown">
    <span class="h-5 w-5 animate-spin rounded-ui-badge border-2 border-ui-border border-t-ui-primary" aria-hidden="true"></span>
    <span class="text-sm font-semibold text-ui-text">{{ label }}</span>
  </div>
</div>
{% endif %}
