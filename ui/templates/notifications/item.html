{% load component_tags %}
<div
  data-ui-core="notification-item"
  class="group flex items-start gap-3 border-b border-ui-border px-4 py-3 {% if detail_url and detail_url != '#' %}cursor-pointer hover:bg-ui-surface-hover{% else %}hover:bg-ui-surface-hover{% endif %} {% if not is_read %}bg-ui-info/5{% endif %}"
  {% if detail_url and detail_url != "#" %}
    hx-get="{{ detail_url }}"
    hx-target="{{ detail_target|default:'#director-notification-detail' }}"
    hx-swap="innerHTML"
    @click="if ({{ detail_opens_drawer|yesno:'true,false' }} && window.deOpenDrawer) window.deOpenDrawer()"
  {% endif %}
  {% if hx_mark_read %}
    hx-post="{{ hx_mark_read }}"
    hx-swap="outerHTML"
    hx-target="closest [data-ui-core='notification-item']"
  {% endif %}
  role="menuitem"
>
  <div class="relative flex-shrink-0 pt-0.5">
    <div class="flex h-8 w-8 items-center justify-center rounded-full {% if priority == 'high' %}bg-ui-danger/10 text-ui-danger{% elif priority == 'low' %}bg-ui-text-muted/10 text-ui-text-muted{% else %}bg-ui-info/10 text-ui-info{% endif %}">
      <i data-lucide="{{ icon }}" class="h-4 w-4"></i>
    </div>
    {% if not is_read %}
      <span class="absolute -top-0.5 -right-0.5 h-2.5 w-2.5 rounded-full bg-ui-info" aria-label="Non lue"></span>
    {% endif %}
  </div>
  <div class="min-w-0 flex-1">
    <div class="flex items-start justify-between gap-2">
      <p class="text-sm font-medium text-ui-text {% if not is_read %}font-semibold{% endif %}">{{ title|default:"Notification" }}</p>
      <span class="flex-shrink-0 text-xs text-ui-text-muted">{{ time_ago }}</span>
    </div>
    {% if summary %}
      <p class="mt-0.5 line-clamp-2 text-xs text-ui-text-muted">{{ summary }}</p>
    {% endif %}
    {% if source %}
      <p class="mt-1 text-[10px] uppercase tracking-wide text-ui-text-muted">{{ source }}</p>
    {% endif %}
  </div>
  {% if action_url and action_url != "#" %}
    <a href="{{ action_url }}" class="flex-shrink-0 self-center rounded p-1 text-ui-text-muted opacity-0 group-hover:opacity-100 hover:bg-ui-surface-muted focus-visible:opacity-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ui-focus" aria-label="Ouvrir">
      <i data-lucide="external-link" class="h-3.5 w-3.5"></i>
    </a>
  {% endif %}
</div>
