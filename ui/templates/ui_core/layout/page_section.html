{% load component_tags %}
<section class="py-5" {% if labelled_by %}aria-labelledby="{{ labelled_by }}"{% endif %} data-ui-core="page-section">
  {% if title or description %}
    <header class="mb-4">
      {% if title %}<h2 {% if labelled_by %}id="{{ labelled_by }}"{% endif %} class="text-lg font-bold text-ui-text">{{ title }}</h2>{% endif %}
      {% if description %}<p class="mt-1 text-sm text-ui-text-muted">{{ description }}</p>{% endif %}
    </header>
  {% endif %}
  {% slot "default" %}{% endslot %}
</section>
