{% load component_tags %}
<div class="mb-4 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
  <div class="flex items-start gap-2.5 {% if align == 'center' %}mx-auto text-center{% endif %}">
    {% if icon %}
      <span class="mt-0.5 grid h-7 w-7 shrink-0 place-items-center rounded-lg bg-[color:var(--school-primary-soft)] text-[color:var(--school-primary)]">
        <i data-lucide="{{ icon }}" style="width:15px;height:15px;"></i>
      </span>
    {% endif %}
    <div class="min-w-0">
      <div class="flex items-center gap-2">
        <h2 class="text-base font-black text-[color:var(--text)]">{{ title }}</h2>
        {% if badge %}
          {% component "badge" label=badge tone="primary" size="sm" %}{% endcomponent %}
        {% endif %}
      </div>
      {% if subtitle %}<p class="mt-0.5 text-xs font-semibold text-[color:var(--muted)]">{{ subtitle }}</p>{% endif %}
    </div>
  </div>
  <div class="flex items-center gap-2 {% if align == 'center' %}justify-center{% endif %}">
    {% slot "action" %}{% endslot %}
  </div>
</div>
