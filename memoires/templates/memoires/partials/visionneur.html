{% load static %}
<div id="memoire-visionneur"
     class="memoire-visionneur relative bg-white/95 rounded-3xl border border-slate-200/80 shadow-soft overflow-hidden flex flex-col"
     data-nb-pages="{{ memoire.nb_pages }}"
     data-page-url-template="{% url 'memoires:page' slug=memoire.slug numero=999999 %}"
     role="region"
     aria-label="Visionneur de mémoire">

  {% if memoire.nb_pages > 0 %}

  <!-- Barre de progression -->
  <div class="relative h-1 bg-slate-100 flex-shrink-0">
    <div id="visionneur-progress-bar"
         class="absolute inset-y-0 left-0 bg-gradient-to-r from-primary-500 to-secondary transition-all duration-300 ease-out"
         style="width: 0%"
         role="progressbar"
         aria-valuenow="1"
         aria-valuemin="1"
         aria-valuemax="{{ memoire.nb_pages }}"></div>
  </div>

  <!-- Barre d'outils principale -->
  <div class="flex items-center justify-between px-3 sm:px-5 py-2.5 sm:py-3 border-b border-slate-100 bg-slate-50/80 gap-2 flex-shrink-0">

    <!-- Gauche : navigation pages -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <button type="button" id="page-precedente" aria-label="Page précédente"
              class="inline-flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-xl border border-slate-200 bg-white text-slate-600 hover:border-primary-200 hover:text-primary-600 disabled:opacity-40 disabled:cursor-not-allowed transition">
        <i data-lucide="chevron-left" class="w-4 h-4"></i>
      </button>

      <div class="flex items-center gap-1.5 text-sm">
        <input type="number" id="page-input" min="1" max="{{ memoire.nb_pages }}" value="1"
               aria-label="Numéro de page"
               class="w-12 sm:w-14 text-center text-sm font-semibold text-slate-900 bg-white border border-slate-200 rounded-lg py-1 focus:outline-none focus:ring-2 focus:ring-primary-300 focus:border-primary-300 transition">
        <span class="text-slate-400">/</span>
        <span id="page-totale" class="font-medium text-slate-500">{{ memoire.nb_pages }}</span>
      </div>

      <button type="button" id="page-suivante" aria-label="Page suivante"
              class="inline-flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-xl border border-slate-200 bg-white text-slate-600 hover:border-primary-200 hover:text-primary-600 disabled:opacity-40 disabled:cursor-not-allowed transition">
        <i data-lucide="chevron-right" class="w-4 h-4"></i>
      </button>
    </div>

    <!-- Centre : zoom -->
    <div class="hidden sm:flex items-center gap-1.5">
      <button type="button" id="zoom-out" aria-label="Zoom arrière"
              class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-slate-200 bg-white text-slate-600 hover:border-primary-200 hover:text-primary-600 disabled:opacity-40 disabled:cursor-not-allowed transition">
        <i data-lucide="minus" class="w-3.5 h-3.5"></i>
      </button>
      <span id="zoom-level" class="text-xs font-semibold text-slate-600 w-12 text-center tabular-nums">100%</span>
      <button type="button" id="zoom-in" aria-label="Zoom avant"
              class="inline-flex items-center justify-center w-8 h-8 rounded-lg border border-slate-200 bg-white text-slate-600 hover:border-primary-200 hover:text-primary-600 disabled:opacity-40 disabled:cursor-not-allowed transition">
        <i data-lucide="plus" class="w-3.5 h-3.5"></i>
      </button>
      <button type="button" id="zoom-reset" aria-label="Réinitialiser le zoom"
              class="ml-1 text-[10px] font-medium text-slate-400 hover:text-primary-600 transition px-1.5 py-0.5 rounded hover:bg-primary-50">
        Réinitialiser
      </button>
    </div>

    <!-- Droite : actions -->
    <div class="flex items-center gap-1.5 sm:gap-2">
      <button type="button" id="toggle-thumbnails" aria-label="Afficher les miniatures"
              class="inline-flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-xl border border-slate-200 bg-white text-slate-600 hover:border-primary-200 hover:text-primary-600 transition sm:hidden">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
      </button>
      <button type="button" id="toggle-thumbnails-desktop" aria-label="Afficher les miniatures"
              class="hidden sm:inline-flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-xl border border-slate-200 bg-white text-slate-600 hover:border-primary-200 hover:text-primary-600 transition">
        <i data-lucide="layout-grid" class="w-4 h-4"></i>
      </button>
      <button type="button" id="fullscreen-btn" aria-label="Plein écran"
              class="inline-flex items-center justify-center w-8 h-8 sm:w-9 sm:h-9 rounded-xl border border-slate-200 bg-white text-slate-600 hover:border-primary-200 hover:text-primary-600 transition">
        <i data-lucide="maximize" class="w-4 h-4"></i>
      </button>
    </div>
  </div>

  <!-- Zone principale : thumbnails sidebar + image -->
  <div class="flex flex-1 min-h-0 overflow-hidden">

    <!-- Sidebar miniatures (desktop) -->
    <aside id="thumbnails-sidebar"
           class="hidden sm:flex flex-col w-20 md:w-24 lg:w-28 border-r border-slate-100 bg-slate-50/50 overflow-y-auto flex-shrink-0"
           role="navigation"
           aria-label="Miniatures des pages">
      <div id="thumbnails-container" class="flex flex-col gap-1.5 p-2">
        <!-- Thumbnails générées par JS -->
      </div>
    </aside>

    <!-- Panneau miniatures mobile (overlay) -->
    <div id="thumbnails-mobile-panel"
         class="sm:hidden fixed inset-0 z-50 bg-black/50 backdrop-blur-sm hidden"
         role="dialog"
         aria-label="Miniatures des pages">
      <div class="absolute right-0 top-0 bottom-0 w-64 bg-white shadow-2xl flex flex-col">
        <div class="flex items-center justify-between px-4 py-3 border-b border-slate-100">
          <span class="text-sm font-semibold text-slate-700">Pages</span>
          <button type="button" id="close-thumbnails-mobile" aria-label="Fermer"
                  class="w-8 h-8 rounded-lg flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 transition">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>
        <div id="thumbnails-mobile-container" class="flex-1 overflow-y-auto p-2 space-y-1.5">
          <!-- Thumbnails générées par JS -->
        </div>
      </div>
    </div>

    <!-- Zone image principale -->
    <div id="visionneur-viewport"
         class="flex-1 flex items-center justify-center bg-slate-100 overflow-auto min-h-[50vh] sm:min-h-[60vh] md:min-h-[70vh] relative">

      <!-- État de chargement -->
      <div id="visionneur-chargement"
           class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-slate-400">
        <div class="w-10 h-10 rounded-full border-2 border-slate-200 border-t-primary-500 animate-spin"></div>
        <span class="text-sm">Chargement de la page…</span>
      </div>

      <!-- État d'erreur -->
      <div id="visionneur-erreur"
           class="absolute inset-0 flex flex-col items-center justify-center gap-3 text-slate-400 hidden">
        <i data-lucide="alert-circle" class="w-8 h-8 text-red-400"></i>
        <p class="text-sm text-slate-500">Impossible de charger cette page.</p>
        <button type="button" id="retry-btn"
                class="text-xs font-medium text-primary-600 hover:text-primary-700 transition">
          Réessayer
        </button>
      </div>

      <!-- Image du mémoire -->
      <img id="visionneur-image"
           alt="Page du mémoire"
           class="hidden select-none max-w-none transition-transform duration-200"
           draggable="false"
           style="transform-origin: center center;">
    </div>
  </div>

  <!-- Barre de statut inférieure -->
  <div class="flex items-center justify-between px-3 sm:px-5 py-2 border-t border-slate-100 bg-slate-50/80 text-xs text-slate-400 flex-shrink-0 gap-2">
    <span class="hidden sm:inline-flex items-center gap-1.5">
      <i data-lucide="keyboard" class="w-3 h-3"></i>
      Flèches ←→ pour naviguer
    </span>
    <span class="flex items-center gap-1.5">
      <i data-lucide="shield-alert" class="w-3 h-3"></i>
      Lecture en ligne uniquement
    </span>
  </div>

  {% else %}
  <div class="p-12 text-center text-slate-400">
    <i data-lucide="clock" class="w-8 h-8 mx-auto mb-3 text-slate-300"></i>
    <p class="text-sm">Les pages de ce mémoire sont en cours de préparation.</p>
  </div>
  {% endif %}
</div>
