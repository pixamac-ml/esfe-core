{% load component_tags %}
<section class="space-y-5" data-overlay-title="{{ entity_title|default:'Détail exécutif' }}">
  <header class="border-b border-ui-border pb-4">
    <p class="text-xs font-semibold uppercase tracking-wide text-ui-primary">Dossier DG</p>
    <h2 class="mt-1 text-xl font-bold text-ui-text">{{ entity_title }}</h2>
    {% if entity_subtitle %}<p class="mt-1 text-sm text-ui-text-muted">{{ entity_subtitle }}</p>{% endif %}
  </header>

  <dl class="divide-y divide-ui-border rounded-ui-card border border-ui-border bg-ui-surface">
    {% for label, value in entity_fields %}
      <div class="grid gap-1 px-4 py-3 sm:grid-cols-[10rem_minmax(0,1fr)] sm:gap-4">
        <dt class="text-xs font-semibold uppercase tracking-wide text-ui-text-muted">{{ label }}</dt>
        <dd class="whitespace-pre-line break-words text-sm font-medium text-ui-text">{{ value }}</dd>
      </div>
    {% endfor %}
  </dl>

  {% if entity_attachment %}
    <a href="{{ entity_attachment.url }}" target="_blank" rel="noopener noreferrer" class="ui-focus-ring inline-flex h-ui-control items-center gap-2 rounded-ui-button border border-ui-border px-4 text-sm font-semibold text-ui-primary hover:bg-ui-surface-hover">
      <i data-lucide="paperclip" class="h-4 w-4" aria-hidden="true"></i>Ouvrir le justificatif
    </a>
  {% endif %}
</section>
