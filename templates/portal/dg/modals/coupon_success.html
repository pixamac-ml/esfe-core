<div class="p-6" data-dg-modal-close="1">
  <div class="rounded-2xl border border-emerald-100 bg-emerald-50 p-5">
    <p class="text-xs font-black uppercase tracking-[.18em] text-emerald-700">Coupon cree</p>
    <h3 class="mt-2 text-2xl font-black text-slate-950">{{ coupon.code }}</h3>
    <p class="mt-2 text-sm font-semibold text-emerald-800">{{ coupon.label }} — communiquez ce code a l'etudiant concerne.</p>
  </div>
  <div class="mt-5 grid grid-cols-1 gap-3 md:grid-cols-2">
    <div class="rounded-xl border border-slate-200 p-4">
      <p class="text-xs font-black text-slate-500">Reduction</p>
      <p class="mt-1 text-lg font-black text-slate-950">
        {% if coupon.discount_type == "percentage" %}{{ coupon.value }}%{% else %}{{ coupon.value }} FCFA{% endif %}
      </p>
    </div>
    <div class="rounded-xl border border-slate-200 p-4">
      <p class="text-xs font-black text-slate-500">Validite</p>
      <p class="mt-1 text-lg font-black text-slate-950">jusqu'au {{ coupon.valid_until|date:"d/m/Y" }}</p>
    </div>
  </div>
  <div class="mt-5 flex justify-end">
    <button type="button" class="dg-action dg-action-dark" onclick="dgRefreshCurrentSection(); dgCloseModal()">Fermer</button>
  </div>
</div>
