{% load component_tags %}
<header class="flex flex-col gap-3 border-b border-ui-border pb-4 sm:flex-row sm:items-end sm:justify-between" data-ui-core="page-header">
  <div class="min-w-0 flex-1">
    {% if eyebrow %}<p class="mb-0.5 text-[11px] font-bold uppercase tracking-wide text-ui-primary">{{ eyebrow }}</p>{% endif %}
    <h1 class="break-words text-xl font-bold text-ui-text sm:text-2xl">{{ title|default:"Sans titre" }}</h1>
    {% if subtitle %}<p class="mt-0.5 max-w-3xl text-sm text-ui-text-muted">{{ subtitle }}</p>{% endif %}
  </div>
  <div class="flex max-w-full shrink-0 flex-wrap gap-2">{% slot "actions" %}{% endslot %}</div>
</header>
