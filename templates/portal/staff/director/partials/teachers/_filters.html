<form method="get" hx-get="{% url 'accounts_portal:director_teachers_subcontent' %}" hx-target="#director-teacher-subcontent" hx-swap="innerHTML" hx-trigger="submit, change from:select" hx-indicator="#director-teacher-loading" hx-sync="#director-teacher-subcontent:replace" class="grid min-w-0 gap-3 border-y border-ui-border py-4 sm:grid-cols-[minmax(13rem,1fr)_minmax(12rem,16rem)_auto]">
  <input type="hidden" name="view" value="{{ teacher_subview }}">
  <label class="min-w-0"><span class="sr-only">Rechercher un enseignant</span><input type="search" name="teacher_q" value="{{ teacher_q }}" placeholder="Nom, email, code ou spécialité" class="h-ui-control w-full rounded-ui-input border border-ui-border bg-ui-surface px-3 text-sm text-ui-text focus:border-ui-focus focus:ring-ui-focus"></label>
  <label><span class="sr-only">Filtrer les enseignants</span><select name="teacher_scope" class="h-ui-control w-full rounded-ui-input border border-ui-border bg-ui-surface px-3 text-sm text-ui-text focus:border-ui-focus focus:ring-ui-focus">
    <option value="all"{% if teacher_scope == "all" %} selected{% endif %}>Tous les enseignants</option>
    <option value="assigned"{% if teacher_scope == "assigned" %} selected{% endif %}>Avec affectation</option>
    <option value="unassigned"{% if teacher_scope == "unassigned" %} selected{% endif %}>Sans affectation</option>
    <option value="documents_pending"{% if teacher_scope == "documents_pending" %} selected{% endif %}>Pièces à vérifier</option>
  </select></label>
  <button type="submit" class="ui-focus-ring inline-flex h-ui-control items-center justify-center gap-2 rounded-ui-button border border-ui-border bg-ui-surface px-4 text-sm font-semibold text-ui-text hover:bg-ui-surface-hover"><i data-lucide="search" class="h-4 w-4"></i>Rechercher</button>
</form>
