{% load component_tags %}
<section data-dashboard-section="{{ manager_ui.section }}" class="relative min-w-0 max-w-full">
  <div id="manager-{{ manager_ui.section }}-loading" class="htmx-indicator pointer-events-none absolute inset-0 z-20">
    {% component "ui_core.loading_overlay" loading=True label="Mise à jour" %}{% endcomponent %}
  </div>
  <div
    id="manager-{{ manager_ui.section }}-subcontent"
    class="min-w-0 max-w-full"
    aria-live="polite"
    hx-sync="this:replace"
  >
    {% include manager_ui.subcontent_template %}
  </div>
</section>
